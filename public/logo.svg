<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="40%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Stylized 'C' Ring -->
  <path
    d="M 72 23
       A 36 36 0 1 0 72 77
       L 66 69
       A 26 26 0 1 1 66 31
       Z"
    fill="url(#purple-grad)"
  />

  <path
    d="M 72 23 L 80 23 A 36 36 0 0 1 85 36 L 75 39 A 26 26 0 0 0 72 23 Z"
    fill="url(#purple-grad)"
    opacity="0.9"
  />

  <path
    d="M 72 77 L 80 77 A 36 36 0 0 0 85 64 L 75 61 A 26 26 0 0 1 72 77 Z"
    fill="url(#purple-grad)"
    opacity="0.9"
  />

  <!-- Center ECG Pulse Line -->
  <path
    d="M 10 50
       L 26 50
       L 30 46
       L 34 53
       L 40 40
       L 46 22
       L 54 78
       L 62 30
       L 69 62
       L 76 44
       L 82 50
       L 92 50"
    stroke="url(#pulse-grad)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <circle cx="94" cy="50" r="2.2" fill="#00F0FF" filter="url(#glow)" />
</svg>
