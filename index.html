  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="CodePulse AI - Real-time Codebase, Architecture & Security Auditor" />
    <meta property="og:description" content="Real-time codebase, architecture, and security auditor powered by Gemini models and Mermaid.js diagrams." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Safe property descriptor for window.fetch to prevent extension reassignment errors
        try {
          if (typeof window !== 'undefined') {
            var _origFetch = window.fetch;
            var _curFetch = _origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _curFetch;
              },
              set: function(fn) {
                _curFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore if property descriptor cannot be defined
        }

        // Intercept browser extension script errors and vite websocket disconnects early
        function isIgnorableError(msg, filename) {
          if (!msg) return false;
          var m = (msg + '').toLowerCase();
          var f = (filename || '').toLowerCase();
          return (
            m.indexOf('cannot set property fetch') !== -1 ||
            m.indexOf('fetch of #<window>') !== -1 ||
            m.indexOf('websocket') !== -1 ||
            m.indexOf('ws closed') !== -1 ||
            f.indexOf('chrome-extension://') !== -1 ||
            f.indexOf('moz-extension://') !== -1 ||
            f.indexOf('@vite/client') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          if (event && isIgnorableError(event.message, event.filename)) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event && (event.reason ? (event.reason.message || event.reason) : '')) + '';
          if (isIgnorableError(reason, '')) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        try {
          var saved = localStorage.getItem('codepulse_theme_mode_v2');
          var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch(e) {
          console.warn('Theme initialization fallback applied:', e);
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
